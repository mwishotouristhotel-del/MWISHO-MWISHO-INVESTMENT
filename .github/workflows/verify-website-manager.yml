name: Verify Hotel Website Manager
on:
  pull_request:
    paths:
      - 'src/WebsiteManager.jsx'
      - 'src/WebsiteManager.css'
      - 'src/WebsiteGalleryManager.jsx'
      - 'src/WebsiteGalleryManager.css'
      - 'src/WebsiteRoomsManager.jsx'
      - 'src/WebsiteFoodPayments.jsx'
      - 'src/WebsiteRoomRequests.jsx'
      - 'src/WebsiteRoomsManager.css'
      - 'src/WebsitePromotionsManager.jsx'
      - 'src/WebsitePromotionsManager.css'
      - 'src/galleryUpload.js'
      - 'src/galleryThumbnail.js'
      - 'supabase/functions/hotel-website-public/**'
      - 'hotel/**'
      - 'tests/website-manager/**'
      - '.github/workflows/verify-website-manager.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install static analyzer
        run: npm install --no-save --no-audit --no-fund eslint@9 globals@15 jsdom@26
      - name: Check undefined handlers and variables
        run: npx eslint --config tests/website-manager/eslint.config.mjs src/WebsiteManager.jsx src/WebsiteGalleryManager.jsx src/WebsitePromotionsManager.jsx src/WebsiteRoomsManager.jsx
      - name: Render Website Management with React (smoke test)
        run: node tests/website-manager/render-smoke.mjs
      - name: Test upload and saved image URLs for hero and restaurant
        run: node tests/website-manager/upload-flow.mjs
      - name: Test gallery optimization and original-file option
        run: node tests/website-manager/gallery-optimization.mjs
      - name: Test generation of lightweight gallery thumbnails
        run: node tests/website-manager/gallery-thumbnails.mjs
      - name: Simulate advertisement and event popup modes
        run: node tests/website-manager/promotions-popup.mjs
      - name: Verify website autosave and refresh restoration
        run: node tests/website-manager/autosave-navigation.mjs
      - name: Verify About image Admin card and customer mapping
        run: node tests/website-manager/about-image-card.mjs
      - name: Verify up to five photos per room on Admin and customer site
        run: node tests/website-manager/room-five-photos.mjs
      - name: Verify accommodation request flow safety
        run: node tests/website-manager/room-requests.mjs
      - name: Verify food pre-order payment gate
        run: node tests/website-manager/food-preorder-gate.mjs
      - name: Verify manual M-Pesa and food payment approval workflow
        run: node tests/website-manager/manual-mpesa-food.mjs
      - name: Build complete POS and Admin
        run: npm run build
      - name: Check isolated hotel customer website
        run: |
          test -f hotel/index.html
          test -f hotel/assets/mwisho-logo.svg
          grep -q 'hotel-website-public' hotel/index.html
          grep -q 'hotel_website_content' src/WebsiteManager.jsx
