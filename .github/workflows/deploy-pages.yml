name: Deploy MWISHO POS and Customer Hotel to GitHub Pages
on:
  push:
    branches: [main, feature/pos-foundation]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://vsrkdykljelafkoixjtq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cPQ_bQOpdyniRlkJCA4-xg_67heLy6l
      # Deploy one atomic artifact: POS at / and customer hotel at /hotel/.
      # Avoid competing branch-based deployments overriding the POS.
      - name: Include isolated customer hotel website
        run: |
          test -f hotel/index.html
          test -f hotel/assets/mwisho-logo.svg
          mkdir -p dist/hotel
          cp -R hotel/. dist/hotel/
          test -f dist/index.html
          test -f dist/hotel/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
